<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-[1600px] mx-auto flex items-center justify-between px-8 h-16">

    <div class="flex items-center space-x-10">

      <div class="flex items-center space-x-2">
        <img src="assets/graphuralogo.png" alt="graphura Logo" class="h-14 w-auto">
       
      </div>

      <div class="hidden md:flex items-center space-x-1" id="navLinks">
        <a href="main.html" 
           class="px-4 py-2 rounded-lg text-sm font-semibold text-blue-600 bg-blue-50 transition-all">
          Publish
        </a>
        <a href="statistics.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Statistics
        </a>
        <a href="library.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Media Library
        </a>
        <a href="#" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Start Page
        </a>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      
    <label class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold cursor-pointer hover:bg-blue-700 transition">
      Upload Media
      <input type="file" id="mediaUpload" multiple accept="image/*,video/*" class="hidden" />
    </label>

      <div class="h-6 w-px bg-gray-200 mx-2"></div>

      <div class="relative" id="profileDropdown">
        <button
          id="profileBtn"
          class="group relative w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center border-2 border-transparent hover:border-blue-100 transition-all focus:outline-none">
          
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600 transition-colors" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>

          <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </button>

        <div
          id="profileMenu"
          class="absolute right-0 mt-3 w-64 bg-white border border-gray-100 rounded-xl shadow-2xl hidden z-50 animate-in fade-in zoom-in duration-150">
          
          <div class="px-4 py-3 border-b border-gray-50">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Account</p>
            <p id="userEmail" class="text-sm font-medium text-gray-900 truncate"></p>
          </div>

          <div class="py-1 text-sm text-gray-700">
            <button class="dropdown-item">⚙ Settings</button>
            <button class="dropdown-item">🧩 Channels</button>
            <button onclick="logout()" class="dropdown-item text-red-500 hover:bg-red-50">Logout</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</nav>

<!-- FILTERS -->
<div class="px-8 py-4 flex justify-between items-center">
  <div class="flex gap-4">
    <button onclick="filterMedia('all')" class="filter-btn active">All</button>
    <button onclick="filterMedia('image')" class="filter-btn">Images</button>
    <button onclick="filterMedia('video')" class="filter-btn">Videos</button>
  </div>
  
</div>

<!-- MEDIA GRID -->
<section id="mediaGrid" class="px-8 pb-10 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
  <!-- Media items injected via JS -->
</section>

<!-- PREVIEW MODAL -->
<div id="previewModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
  <div class="bg-white rounded-xl p-4 max-w-lg w-full relative">
    <button onclick="closePreview()" class="absolute top-3 right-3 text-gray-500 hover:text-black">✕</button>
    <div id="previewContent"></div>
  </div>
</div>

<!-- JS -->
<script src="media-library.js"></script>

<!-- Tailwind helpers -->
<style>
  .filter-btn {
    padding: 8px 16px;
    border-radius: 999px;
    background: #e5e7eb;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .filter-btn:hover {
    background: #d1d5db;
  }
  .filter-btn.active {
    background: #2563eb;
    color: white;
  }
  .dropdown-item {
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .dropdown-item:hover {
    background: #f3f4f6;
  }
</style>

</body>
</html>
