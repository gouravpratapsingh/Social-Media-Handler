<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Publish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  .tab-btn {
    padding-bottom: 10px;
    font-weight: 500;
    color: #6b7280;
  }

  .tab-active {
    border-bottom: 2px solid #2563eb;
    color: #2563eb;
  }
  .dropdown-item {
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .dropdown-item:hover {
    background: #f3f4f6;
  }
</style>
</head>

<body class="bg-gray-50 text-gray-800">

<nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-[1600px] mx-auto flex items-center justify-between px-8 h-16">

    <div class="flex items-center space-x-10">

      <div class="flex items-center space-x-2">
        <img src="assets/graphuralogo.png" alt="graphura Logo" class="h-14 w-auto">
       
      </div>

      <div class="hidden md:flex items-center space-x-1" id="navLinks">
        <a href="main.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Publish
        </a>
        <a href="statistics.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Statistics
        </a>
        <a href="library.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Media Library
        </a>
        <a href="home.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">
          Start Page
        </a>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      
      <button
        onclick="alert('New Post Clicked')"
        class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-sm shadow-blue-200 transition-all active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        New Post
      </button>

      <div class="h-6 w-px bg-gray-200 mx-2"></div>

      <div class="relative" id="profileDropdown">
        <button
          id="profileBtn"
          class="group relative w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center border-2 border-transparent hover:border-blue-100 transition-all focus:outline-none">
          
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600 transition-colors" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>

          <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </button>

        <div
          id="profileMenu"
          class="absolute right-0 mt-3 w-64 bg-white border border-gray-100 rounded-xl shadow-2xl hidden z-50 animate-in fade-in zoom-in duration-150">
          
          <div class="px-4 py-3 border-b border-gray-50">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Account</p>
            <p id="userEmail" class="text-sm font-medium text-gray-900 truncate"></p>
          </div>

          <div class="py-1 text-sm text-gray-700">
            <button role="menuitem" class="dropdown-item">⚙ Settings</button>
            <button role="menuitem" class="dropdown-item">🧩 Channels</button>
            <button role="menuitem" onclick="logout()" class="dropdown-item text-red-500 hover:bg-red-50">Logout</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</nav>


<!-- MAIN LAYOUT -->
<div class="flex min-h-screen">
  <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

  <!-- CONTENT -->
  <main class="flex-1 p-10">
   <header class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-50 text-blue-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">All Channels</h1>
  </div>

  <div class="inline-flex items-center bg-gray-200 rounded-xl p-1">
    <button id="listViewBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white text-blue-600 font-medium shadow transition">
      📋 List
    </button>
    <button id="calendarViewBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg text-gray-600 hover:text-gray-800 transition">
      📅 Calendar
    </button>
  </div>
</header>

<section id="listViewContent" class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
  <p class="text-gray-600 italic">Your scheduled posts list will appear here.</p>
</section>

<section id="calendarViewContent" class="hidden bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
  
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center space-x-4">
      <div class="flex items-center bg-gray-100 rounded-lg p-1">
        <button id="prevMonth" class="p-2 rounded-md hover:bg-white hover:shadow-sm transition">←</button>
        <h2 id="calendarTitle" class="text-lg font-bold text-gray-800 px-4 min-w-[150px] text-center"></h2>
        <button id="nextMonth" class="p-2 rounded-md hover:bg-white hover:shadow-sm transition">→</button>
      </div>
    </div>

    <button 
      onclick="alert('Opening Schedule Post Modal...')"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      Schedule Post
    </button>
  </div>

  <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>

  <div id="calendarGrid" class="grid grid-cols-7 gap-px bg-gray-200 border border-gray-200 rounded-lg overflow-hidden"></div>
</section>
    <!-- TABS -->
    <div class="flex items-center justify-between border-b mb-10">
      <div class="flex space-x-6">
        <button onclick="switchTab('queue', event)" class="tab-btn tab-active">Queue (0)</button>
        <button onclick="switchTab('drafts', event)" class="tab-btn">Drafts (0)</button>
        <button onclick="switchTab('approvals', event)" class="tab-btn">Approvals</button>
        <button onclick="switchTab('sent', event)" class="tab-btn">Sent (0)</button>
      </div>

      
    </div>
    

    <!-- EMPTY STATE -->
    <div id="contentArea" class="text-center mt-20">
      <h3 class="text-xl font-semibold mb-2">Welcome to Graphura 👋</h3>
      <p class="text-gray-500 mb-6">
        Connect a channel to start posting and managing your comments
      </p>

      <div class="flex justify-center space-x-4">
        <button
          onclick="alert('Connect Channel Clicked')"
          class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700">
          + Connect a Channel
        </button>

        
      </div>
    </div>

  </main>
  
</div>

<script>
    function logout() {
      localStorage.removeItem('authToken');
      alert("You have been logged out.");
      window.location.href = 'login.html';
    }

    // PROTECT THE PAGE: Redirect to login if no token exists
  window.onload = () => {
      const token = localStorage.getItem('authToken');
      if (!token) {
          window.location.href = 'login.html';
      }

      // Display user email in profile dropdown
      const userEmail = localStorage.getItem('userEmail') || '<EMAIL>';
      document.getElementById("userEmail").textContent = userEmail;
  };
  const profileBtn = document.getElementById("profileBtn");
  const profileMenu = document.getElementById("profileMenu");

// Toggle dropdown
profileBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  profileMenu.classList.toggle("hidden");
});

// Close on outside click
document.addEventListener("click", () => {
  profileMenu.classList.add("hidden");
});

// Prevent close when clicking inside menu
profileMenu.addEventListener("click", (e) => {
  e.stopPropagation();
});

// Modal control functions
function openModal() {
    document.getElementById('postModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('postModal').classList.add('hidden');
    document.getElementById('scheduleForm').reset();
}

// Attach openModal to your "New Post" button
document.querySelectorAll('button').forEach(btn => {
    if(btn.innerText.includes('New Post') || btn.innerText.includes('Schedule Post')) {
        btn.onclick = openModal;
    }
});
